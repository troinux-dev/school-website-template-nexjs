# Production-style run on a VPS (e.g. Hostinger Docker). Database is Supabase, so no db service here.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
    image: ${WEB_IMAGE:-school-website:latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
